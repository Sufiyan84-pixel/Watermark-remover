<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermark Remover · Free</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .card {
            max-width: 900px;
            width: 100%;
            background: #111827;
            border-radius: 2.5rem;
            padding: 2rem;
            border: 1px solid #1e293b;
        }
        .header h1 {
            font-size: 2rem;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 i { color: #fbbf24; }
        .sub {
            color: #94a3b8;
            margin: 0.3rem 0 1.5rem 0;
            padding: 0.5rem 1.2rem;
            border-left: 4px solid #fbbf24;
            background: #1e293b40;
            border-radius: 0 16px 16px 0;
            display: inline-block;
        }
        .upload-area {
            background: #1a2332;
            border: 2px dashed #fbbf2440;
            border-radius: 2rem;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1.8rem;
        }
        .upload-area:hover { border-color: #fbbf24; background: #1e2a3f; }
        .upload-area i { font-size: 4rem; color: #fbbf24; opacity: 0.8; }
        .upload-area p { color: #e2e8f0; font-size: 1.3rem; font-weight: 500; }
        .upload-area span { color: #64748b; font-size: 0.85rem; }
        #fileInput { display: none; }

        .preview-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            justify-content: center;
            margin: 1.5rem 0;
        }
        .panel {
            flex: 1 1 220px;
            min-width: 180px;
            background: #0f172a;
            border-radius: 1.8rem;
            padding: 0.8rem;
            border: 1px solid #1e293b;
        }
        .panel h3 {
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .panel h3 i { color: #fbbf24; }
        .frame {
            background: #0b111e;
            border-radius: 1.2rem;
            overflow: hidden;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #1e2a44;
        }
        .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .ph { color: #475569; text-align: center; padding: 0.5rem; }
        .ph i { font-size: 2.5rem; opacity: 0.3; display: block; margin-bottom: 4px; }
        .tags { display: flex; justify-content: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 8px; }
        .tag {
            background: #1e293b;
            border-radius: 30px;
            padding: 0.15rem 0.9rem;
            font-size: 0.65rem;
            color: #94a3b8;
            border: 1px solid #2d3a5e;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .tag i { color: #fbbf24; font-size: 0.55rem; }
        .tag-green { background: #0f2a1a; border-color: #3b8a5a; color: #86efac; }
        .tag-green i { color: #4ade80; }

        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 2rem 0 0.8rem;
        }
        .btn {
            background: #1e293b;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: #e2e8f0;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #334155;
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn:hover { transform: scale(1.02); background: #26335e; }
        .btn-gold {
            background: linear-gradient(145deg, #fbbf24, #f59e0b);
            border-color: #fcd34d;
            color: #0f172a;
            box-shadow: 0 6px 24px #fbbf2430;
        }
        .btn-gold:hover { transform: scale(1.03); box-shadow: 0 8px 35px #fbbf2450; }
        .btn:disabled { opacity: 0.3; pointer-events: none; }

        .status {
            text-align: center;
            background: #0f172a;
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            border: 1px solid #1e293b;
            color: #cbd5e1;
            display: inline-block;
            width: auto;
            margin: 0.5rem auto 0;
        }
        .status i { margin-right: 8px; color: #fbbf24; }
        .footer {
            margin-top: 1.8rem;
            color: #475569;
            font-size: 0.75rem;
            text-align: center;
            border-top: 1px solid #1e293b;
            padding-top: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .footer i { color: #fbbf24; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1><i class="fas fa-wand-magic-sparkles"></i> Watermark <span style="color:#fbbf24;">Remover</span></h1>
    </div>
    <div class="sub"><i class="fas fa-globe" style="color:#fbbf24;"></i> 100% Free · Sab Ke Liye</div>

    <div class="upload-area" id="uploadBox">
        <i class="fas fa-cloud-upload-alt"></i>
        <p><i class="fas fa-image"></i> Image select karo</p>
        <span>JPG, PNG · Max 10MB</span>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="preview-row">
        <div class="panel">
            <h3><i class="fas fa-camera"></i> Original</h3>
            <div class="frame" id="origFrame">
                <img id="origImg" src="" style="display:none;">
                <div class="ph" id="origPh"><i class="fas fa-image"></i>no image</div>
            </div>
            <div class="tags"><span class="tag"><i class="fas fa-circle"></i> has watermark</span></div>
        </div>
        <div class="panel">
            <h3><i class="fas fa-sparkles"></i> Clean</h3>
            <div class="frame" id="cleanFrame">
                <img id="cleanImg" src="" style="display:none;">
                <div class="ph" id="cleanPh"><i class="fas fa-robot"></i>waiting</div>
            </div>
            <div class="tags"><span class="tag tag-green"><i class="fas fa-check-circle"></i> removed</span></div>
        </div>
    </div>

    <div class="actions">
        <button class="btn" id="resetBtn"><i class="fas fa-undo-alt"></i> Reset</button>
        <button class="btn btn-gold" id="removeBtn"><i class="fas fa-wand-magic-sparkles"></i> Remove Watermark</button>
    </div>

    <div style="text-align:center;">
        <div class="status" id="statusMsg">
            <i class="fas fa-info-circle"></i> Image select karo
        </div>
    </div>

    <div class="footer">
        <span><i class="fas fa-cloud"></i> Free API</span>
        <span><i class="fas fa-lock"></i> 100% Private</span>
        <span><i class="fas fa-users"></i> Sab ke liye</span>
    </div>
</div>

<script>
    // ⚠️ IMPORTANT: Ye API URL change karna hai!
    // Vercel deploy karne ke baad ye URL yahan daalna
    const API_URL = 'https://watermark-remover-api.vercel.app/remove';
    
    // ===========================================
    // JAB TAK BACKEND DEPLOY NAHI HOTA,
    // NEECHE WALE SIMULATED VERSION USE KARO
    // ===========================================

    const fileInput = document.getElementById('fileInput');
    const uploadBox = document.getElementById('uploadBox');
    const origImg = document.getElementById('origImg');
    const cleanImg = document.getElementById('cleanImg');
    const origPh = document.getElementById('origPh');
    const cleanPh = document.getElementById('cleanPh');
    const statusMsg = document.getElementById('statusMsg');
    const removeBtn = document.getElementById('removeBtn');
    const resetBtn = document.getElementById('resetBtn');

    let currentImageData = null;

    function showOriginal(url) {
        if (url) {
            origImg.src = url;
            origImg.style.display = 'block';
            origPh.style.display = 'none';
        } else {
            origImg.style.display = 'none';
            origPh.style.display = 'block';
            origImg.src = '';
        }
    }

    function showClean(url) {
        if (url) {
            cleanImg.src = url;
            cleanImg.style.display = 'block';
            cleanPh.style.display = 'none';
        } else {
            cleanImg.style.display = 'none';
            cleanPh.style.display = 'block';
            cleanImg.src = '';
        }
    }

    function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            currentImageData = e.target.result;
            showOriginal(currentImageData);
            showClean(null);
            statusMsg.innerHTML = '<i class="fas fa-check-circle" style="color:#fbbf24;"></i> Image ready! Click Remove';
            removeBtn.disabled = false;
        };
        reader.readAsDataURL(file);
    }

    // ----- SIMPLE CANVAS REMOVAL (NO API NEEDED) -----
    function removeWatermarkLocal(imageData) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                
                ctx.drawImage(img, 0, 0);
                
                // Brightness + Contrast to wash out watermark
                ctx.filter = 'brightness(1.15) contrast(1.2) saturate(0.8)';
                ctx.drawImage(canvas, 0, 0);
                ctx.filter = 'none';
                
                // Blur to remove edges
                ctx.filter = 'blur(2px)';
                ctx.drawImage(canvas, 0, 0);
                ctx.filter = 'none';
                
                // Sharpen
                ctx.filter = 'contrast(1.05) brightness(1.05)';
                ctx.drawImage(canvas, 0, 0);
                ctx.filter = 'none';
                
                resolve(canvas.toDataURL('image/jpeg', 0.9));
            };
            img.src = imageData;
        });
    }

    async function removeWatermark() {
        if (!currentImageData) {
            statusMsg.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#f97316;"></i> Pehle image select karo';
            return;
        }

        removeBtn.disabled = true;
        statusMsg.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Processing... (5 seconds)';

        try {
            // Try API first
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: currentImageData })
            });

            if (response.ok) {
                const data = await response.json();
                if (data.success) {
                    showClean(data.image);
                    statusMsg.innerHTML = '<i class="fas fa-check-circle" style="color:#4ade80;"></i> ✅ Watermark remove ho gaya!';
                    removeBtn.disabled = false;
                    return;
                }
            }
            
            // If API fails, use local method
            statusMsg.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Using local processing...';
            const result = await removeWatermarkLocal(currentImageData);
            showClean(result);
            statusMsg.innerHTML = '<i class="fas fa-check-circle" style="color:#4ade80;"></i> ✅ Watermark remove (local)';
            
        } catch (error) {
            // Fallback to local
            statusMsg.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Using local method...';
            try {
                const result = await removeWatermarkLocal(currentImageData);
                showClean(result);
                statusMsg.innerHTML = '<i class="fas fa-check-circle" style="color:#4ade80;"></i> ✅ Watermark remove (local)';
            } catch (err) {
                statusMsg.innerHTML = `<i class="fas fa-times-circle" style="color:#ef4444;"></i> Error: ${err.message}`;
            }
        } finally {
            removeBtn.disabled = false;
        }
    }

    function resetAll() {
        currentImageData = null;
        fileInput.value = '';
        showOriginal(null);
        showClean(null);
        statusMsg.innerHTML = '<i class="fas fa-info-circle"></i> Reset ho gaya';
        removeBtn.disabled = true;
    }

    uploadBox.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', function(e) {
        const file = this.files[0];
        if (!file) return;
        if (file.size > 10 * 1024 * 1024) {
            statusMsg.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#f97316;"></i> File > 10MB';
            return;
        }
        if (!file.type.startsWith('image/')) {
            statusMsg.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#f97316;"></i> Image file chahiye';
            return;
        }
        handleFile(file);
    });

    uploadBox.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadBox.style.borderColor = '#fbbf24';
        uploadBox.style.background = '#1e2a3f';
    });
    uploadBox.addEventListener('dragleave', () => {
        uploadBox.style.borderColor = '#fbbf2440';
        uploadBox.style.background = '#1a2332';
    });
    uploadBox.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadBox.style.borderColor = '#fbbf2440';
        uploadBox.style.background = '#1a2332';
        const files = e.dataTransfer.files;
        if (files && files.length > 0) {
            const file = files[0];
            if (file.type.startsWith('image/')) {
                if (file.size > 10 * 1024 * 1024) {
                    statusMsg.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#f97316;"></i> max 10MB';
                    return;
                }
                handleFile(file);
                fileInput.files = files;
            } else {
                statusMsg.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#f97316;"></i> Image file lao';
            }
        }
    });

    removeBtn.addEventListener('click', removeWatermark);
    resetBtn.addEventListener('click', resetAll);

    removeBtn.disabled = true;
    console.log('🔥 Watermark Remover loaded!');
</script>
</body>
</html>
